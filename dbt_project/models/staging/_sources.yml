version: 2

sources:
  - name: raw
    description: Raw tables written by extract_load.py. Everything is text, untouched.
    tables:
      - name: nyc_311_requests
        loaded_at_field: _loaded_at
        freshness:                       # `dbt source freshness` checks this
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
      - name: load_log
        description: One row per load attempt, with reconciliation counts.
